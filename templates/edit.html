{% extends "base.html" %}{% block content %}
<div class="card"><h3>Edit expense</h3>
<form method="post">
 <input name="title" value="{{e.title}}" required>
 <input name="amount" type="number" step="0.01" value="{{e.amount}}" required>
 <select name="category">{% for c in categories %}<option {% if c==e.category %}selected{% endif %}>{{c}}</option>{% endfor %}</select>
 <input name="date" type="date" value="{{e.date}}" required>
 <button>Save</button> <a href="/">Cancel</a></form></div>
{% endblock %}
