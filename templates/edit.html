{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:640px;margin:0 auto"><h3>✏️ Edit expense</h3>
<form class="add" style="grid-template-columns:1fr 1fr" method="post">
 <input name="title" value="{{e.title}}" required>
 <input name="amount" type="number" step="0.01" value="{{e.amount}}" required>
 <select name="category">{% for c in categories %}<option {% if c==e.category %}selected{% endif %}>{{c}}</option>{% endfor %}</select>
 <input name="date" type="date" value="{{e.date}}" required>
 <button>Save changes</button><a class="btn" style="background:#e5e7eb;color:#374151;text-align:center" href="/">Cancel</a></form></div>
{% endblock %}
