<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Expense Tracker</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem;color:#222}
 h1{margin-bottom:.2rem} .card{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}
 input,select,button{padding:.5rem;margin:.2rem;border:1px solid #bbb;border-radius:6px}
 button{background:#2563eb;color:#fff;border:0;cursor:pointer} button.del{background:#dc2626}
 table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:.5rem;border-bottom:1px solid #eee}
 .tot{display:flex;gap:.5rem;flex-wrap:wrap} .pill{background:#eef2ff;padding:.4rem .8rem;border-radius:999px}
 form.inline{display:inline}
</style></head>
<body><h1>💰 Smart Expense Tracker</h1>{% block content %}{% endblock %}</body></html>
