<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Expense Tracker</title>
<style>
 :root{--bg:#f3f4f9;--card:#fff;--text:#1e293b;--muted:#64748b;--line:#e2e8f0;--primary:#4f46e5;--primary-d:#4338ca;--danger:#ef4444}
 *{box-sizing:border-box}
 body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:16px;background:var(--bg);color:var(--text)}
 .container{max-width:1180px;margin:0 auto;padding:0 1.5rem}
 header{background:linear-gradient(120deg,#4338ca 0%,#6d28d9 55%,#a21caf 100%);color:#fff;padding:2rem 0 6rem}
 header .container{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
 header h1{margin:0;font-size:2rem;letter-spacing:-.02em} header p{margin:.35rem 0 0;opacity:.85;font-size:1rem}
 .date-pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:.5rem 1rem;border-radius:99px;font-size:.9rem}
 main.container{margin-top:-4rem;padding-bottom:2.5rem}
 .card{background:var(--card);border-radius:16px;padding:1.5rem;box-shadow:0 6px 20px rgba(15,23,42,.07);margin-bottom:1.25rem}
 .card h3{margin:0 0 1.1rem;font-size:1.1rem}
 .layout{display:grid;grid-template-columns:360px 1fr;gap:1.25rem;align-items:start}
 .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-bottom:1.25rem}
 .stat{background:var(--card);border-radius:16px;padding:1.2rem 1.4rem;box-shadow:0 6px 20px rgba(15,23,42,.07);display:flex;align-items:center;gap:1rem}
 .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;flex:none}
 .ico.i1{background:#e0e7ff}.ico.i2{background:#dcfce7}.ico.i3{background:#fae8ff}.ico.i4{background:#ffedd5}
 .stat .value{white-space:nowrap}
 .stat .sub{color:var(--muted);font-size:.78rem;margin-top:.1rem}
 .stat .label{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
 .stat .value{font-size:1.6rem;font-weight:800;margin-top:.1rem}
 label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin:.9rem 0 .35rem}
 input,select{padding:.75rem .85rem;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fff;width:100%;font-family:inherit;color:var(--text)}
 input:focus,select:focus{outline:3px solid #c7d2fe;border-color:var(--primary)}
 .row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
 button,.btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:.8rem 1.2rem;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;font-family:inherit}
 button:hover,.btn:hover{background:var(--primary-d)}
 .full{width:100%;margin-top:1.2rem}
 button.del{background:#fee2e2;color:var(--danger);padding:.4rem .85rem;font-size:.85rem}
 button.del:hover{background:var(--danger);color:#fff}
 a.edit{color:var(--primary);text-decoration:none;font-weight:600;font-size:.9rem;margin-right:.5rem;padding:.4rem .7rem;border-radius:8px;background:#eef2ff}
 a.edit:hover{background:#e0e7ff}
 .donut-wrap{display:flex;justify-content:center;margin:.2rem 0 1.2rem}
 .donut{width:190px;height:190px;border-radius:50%;display:grid;place-items:center}
 .donut .hole{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
 .donut .hole small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
 .donut .hole b{font-size:1.15rem}
 .legend .item{display:flex;align-items:center;gap:.6rem;padding:.45rem 0;font-size:.95rem;border-bottom:1px dashed var(--line)}
 .legend .item:last-child{border-bottom:0}
 .dot{width:11px;height:11px;border-radius:50%;flex:none}
 .legend .name{flex:1}.legend .pct{color:var(--muted);font-size:.85rem}.legend .amt{font-weight:700;min-width:80px;text-align:right}
 .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:1rem}
 .toolbar select{width:auto;min-width:170px}
 .tablewrap{overflow-x:auto}
 table{width:100%;border-collapse:collapse}
 th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:.7rem .75rem;border-bottom:2px solid var(--line);white-space:nowrap}
 td{padding:.95rem .75rem;border-bottom:1px solid #eef1f6;vertical-align:middle}
 tbody tr:hover td{background:#f8faff}
 td.title{font-weight:600;text-transform:capitalize} td.date{color:var(--muted);white-space:nowrap}
 .amount{font-weight:800;white-space:nowrap} td.actions{white-space:nowrap;text-align:right}
 form.inline{display:inline}
 .badge{padding:.28rem .8rem;border-radius:99px;font-size:.8rem;font-weight:700;background:#e5e7eb;white-space:nowrap}
 .b-Food{background:#ffedd5;color:#c2410c}.b-Travel{background:#dbeafe;color:#1d4ed8}.b-Books{background:#dcfce7;color:#15803d}
 .b-Entertainment{background:#fae8ff;color:#a21caf}.b-Bills{background:#fee2e2;color:#b91c1c}.b-Health{background:#ccfbf1;color:#0f766e}.b-Other{background:#e5e7eb;color:#374151}

 .tabs{display:inline-flex;background:#eef1f8;border-radius:12px;padding:4px;gap:4px}
 .tab{background:transparent;color:var(--muted);border-radius:9px;padding:.5rem 1.2rem;font-weight:700;font-size:.95rem}
 .tab:hover{background:#e2e7f5;color:var(--text)} .tab.on{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(15,23,42,.12)}
 .sumhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;gap:1rem;flex-wrap:wrap}
 .panel{display:none}.panel.on{display:block}
 .period{display:grid;grid-template-columns:190px 70px 1fr 100px;gap:.8rem;align-items:center;padding:.65rem .6rem;border-radius:10px;text-decoration:none;color:var(--text);font-size:.95rem;border:1px solid transparent}
 .period:hover{background:#f5f7ff} .period.active{background:#eef2ff;border-color:#c7d2fe}
 .period .p-label{font-weight:600} .period em{font-style:normal;background:#dcfce7;color:#15803d;font-size:.7rem;font-weight:700;padding:.1rem .5rem;border-radius:99px;margin-left:.3rem}
 .period .p-n{color:var(--muted);font-size:.82rem} .period .p-amt{font-weight:800;text-align:right}
 .period .track{background:#eef0f6;border-radius:99px;height:9px;overflow:hidden}.period .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#a855f7)}
 .chip{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;border-radius:12px;padding:.6rem 1rem;margin-bottom:1rem;font-size:.92rem}
 .chip a{color:#3730a3;font-weight:700;text-decoration:none;background:#fff;padding:.25rem .7rem;border-radius:8px}
 .shown{color:var(--muted);font-size:.85rem;margin-top:.8rem;text-align:right}
 @media(max-width:700px){.period{grid-template-columns:1fr auto}.period .track,.period .p-n{display:none}}
 .empty{text-align:center;color:var(--muted);padding:2.5rem 0}
 .hint{color:var(--muted);text-align:center;font-size:.9rem;padding:1rem 0 .5rem}
 footer{text-align:center;color:var(--muted);font-size:.85rem;padding-bottom:2rem}
 .layout>*,.stats>*{min-width:0}
 @media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}}
 @media(max-width:960px){.layout{grid-template-columns:1fr}}
 @media(max-width:520px){.stats{grid-template-columns:1fr}}
 @media(max-width:600px){th:nth-child(1),td.date{display:none}header h1{font-size:1.6rem}}
</style></head>
<body>
<header><div class="container"><div><h1>💰 Smart Expense Tracker</h1><p>Track every rupee. Know where your money goes.</p></div>
<div class="date-pill">📅 {{ today if today else '' }}</div></div></header>
<main class="container">{% block content %}{% endblock %}</main>
<footer>Built with Flask · SQLite · Docker</footer>
</body></html>
